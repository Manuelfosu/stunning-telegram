services:
  - type: web
    name: ssga-holdings
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: ssga-persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PHONE
        value: "0200000000"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://ssga-holdings.onrender.com"
      - key: DATABASE_URL
        value: "sqlite:////var/data/ssga.db"
      - key: UPLOAD_DIR
        value: "/var/data/uploads"
